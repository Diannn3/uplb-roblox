name: geodata

on:
  push:
    paths:
      - "tools/geodata/**"
      - "data/canonical/**"
      - "data/areas/**"
      - "tests/fixtures/geodata/**"
      - "tests/geodata/**"
      - "src/Shared/Generated/**"
      - "pyproject.toml"
      - ".github/workflows/geodata.yml"
  pull_request:
    paths:
      - "tools/geodata/**"
      - "data/canonical/**"
      - "data/areas/**"
      - "tests/fixtures/geodata/**"
      - "tests/geodata/**"
      - "src/Shared/Generated/**"
      - "pyproject.toml"
      - ".github/workflows/geodata.yml"

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geodata dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Schema and artifact validation
        run: python -m tools.geodata.schemas
      - name: Determinism, geometry, freshness, and git safety
        run: python -m tools.geodata.ci_checks
      - name: Phase 1 hardening report
        run: python -m tools.geodata.phase_gate
