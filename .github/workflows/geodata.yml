name: geodata

on:
  push:
    paths:
      - "tools/geodata/**"
      - "data/canonical/**"
      - "data/reviews/**"
      - "data/areas/**"
      - "config/overture.json"
      - "tests/fixtures/geodata/**"
      - "tests/geodata/**"
      - "src/Shared/Generated/**"
      - "tools/terrain/**"
      - "tools/worldgen/**"
      - "tools/blender/**"
      - "tools/roblox/**"
      - "tests/terrain/**"
      - "tests/worldgen/**"
      - "tests/blender/**"
      - "tests/roblox/**"
      - "data/vertical-slices/**"
      - "config/terrain.json"
      - "pyproject.toml"
      - ".github/workflows/geodata.yml"
  pull_request:
    paths:
      - "tools/geodata/**"
      - "data/canonical/**"
      - "data/reviews/**"
      - "data/areas/**"
      - "config/overture.json"
      - "tests/fixtures/geodata/**"
      - "tests/geodata/**"
      - "src/Shared/Generated/**"
      - "tools/terrain/**"
      - "tools/worldgen/**"
      - "tools/blender/**"
      - "tools/roblox/**"
      - "tests/terrain/**"
      - "tests/worldgen/**"
      - "tests/blender/**"
      - "tests/roblox/**"
      - "data/vertical-slices/**"
      - "config/terrain.json"
      - "pyproject.toml"
      - ".github/workflows/geodata.yml"

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install geodata dependencies
        run: python -m pip install -e ".[dev,worldgen]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile Python packages
        run: python -m compileall -q tools tests
      - name: Candidate directory remains fixture-free
        shell: bash
        run: |
          test "$(find data/candidates -type f ! -name .gitkeep | wc -l)" -eq 0
      - name: Schema and artifact validation
        run: python -m tools.geodata.schemas
      - name: Determinism, geometry, freshness, and git safety
        run: python -m tools.geodata.ci_checks
      - name: Phase 1 hardening report
        run: python -m tools.geodata.phase_gate
      - name: Pinned Overture release check (read-only)
        run: python -m tools.geodata.overture_check_updates --offline
